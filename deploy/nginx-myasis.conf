# Replace myasis.example.com, then install this as an nginx server block.
# TLS should be enabled before this dashboard is exposed to the internet.
server {
    listen 80;
    listen [::]:80;
    server_name myasis.example.com;

    # The live-browser API is machine-wide. Keep an independent access gate in
    # front of the entire site, including its WebSocket route.
    auth_basic "Myasis";
    auth_basic_user_file /etc/nginx/.htpasswd-myasis;

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required by the live-browser screencast WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
