<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Ears, drawn first so the head sits over their inner edge. -->
  <circle cx="11.5" cy="15" r="6.8" fill="#2E64A2"/>
  <circle cx="36.5" cy="15" r="6.8" fill="#2E64A2"/>
  <circle cx="11.9" cy="15.6" r="3.4" fill="#A8C9E9"/>
  <circle cx="36.1" cy="15.6" r="3.4" fill="#A8C9E9"/>
  <!-- Head -->
  <circle cx="24" cy="27" r="15.5" fill="#4B84C4"/>
  <!-- Muzzle -->
  <ellipse cx="24" cy="32.6" rx="8.6" ry="6.3" fill="#DCEBF8"/>
  <!-- Cheeks -->
  <circle cx="14.2" cy="30.2" r="2.6" fill="#79ACDA" opacity="0.75"/>
  <circle cx="33.8" cy="30.2" r="2.6" fill="#79ACDA" opacity="0.75"/>
  <!-- Eyes -->
  <circle cx="18.2" cy="25.6" r="2.2" fill="#102F54"/>
  <circle cx="29.8" cy="25.6" r="2.2" fill="#102F54"/>
  <circle cx="17.5" cy="24.9" r="0.75" fill="#FFFFFF"/>
  <circle cx="29.1" cy="24.9" r="0.75" fill="#FFFFFF"/>
  <!-- Nose and smile -->
  <ellipse cx="24" cy="30.6" rx="2.1" ry="1.5" fill="#173E6B"/>
  <path d="M21.2 33.2q2.8 2.6 5.6 0" stroke="#173E6B" stroke-width="1.7" stroke-linecap="round"/>
</svg>
